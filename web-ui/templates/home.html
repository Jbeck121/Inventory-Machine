<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='home-style.css') }}">
    <title>Home page</title>
</head>
    <body>
        <main>
            <h1>Inventory Search</h1>
            <form>
                <label for="inventory">Search for:</label>
                <input type="text" id="inventory" name ="search"/>
                <button>Search</button>
            </form>

            <form>
                <label for="location">Locations:</label>
                <select id="location" name="location">
                    <option value="">All Locations</option>
                    {% for location_option in locations %}
                        <option value="{{ location_option['id'] }}">{{ location_option['name'] }}</option>
                    {% endfor %}
                </select>
                <button>Filter Search</button>
            </form>
        </main>

        {% if results %}
        <h3>Inventory Found</h3>
        <ul>
            {% for item in results %}
                <li>{{ item["description"] }} — {{ item["location_name"] }}</li>
            {% endfor %}
        </ul>
        {% else %}
            <p>Search a name or pick filters to see inventory.</p>
        {% endif %}
    </body>
</html>
