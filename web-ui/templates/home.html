<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='home-style.css') }}">
    <title>Home page</title>
</head>
    <body>
        <h2>Inventory Search</h2>
        <form>
            <label for="inventory">Search by name or tag:</label>
            <input type="text" id="inventory" name ="search"/>
            <button>Search</button>
        </form>

        <form>
            <label for="location">Locations:</label>
            <select id="location" name="location">
                <option value="">All Locations</option>
                {% for location_option in locations %}
                    <option value="{{ location_option['id'] }}">{{ location_option['name'] }}</option>
                {% endfor %}
            </select>
            <button>Filter Search</button>
        </form>

        {% if results %}
        <h3>Inventory Found</h3>
        <ul>
            {% for item in results %}
                <li>
                    <a href="{{ url_for('item_page', item_id=item['id']) }}">{{ item["description"] }}</a>
                    — <a href="{{ url_for('location_page', location_id=item['location_id']) }}">{{ item["location_name"] }}</a>
                </li>
            {% endfor %}
        </ul>
        {% else %}
            <p>Search a name or pick filters to see inventory.</p>
        {% endif %}
    </body>
</html>
