[project]
name = "inventory-machine"
version = "0.1.0"
description = "AI-assisted inventory cataloging pipeline with a SQL backend."
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "Pillow",
    "httpx",
    "chromadb",
    "hdbscan",
    "scikit-learn",
    "PyMySQL",
    "qrcode[pil]",
    "flask",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inventory_machine*"]
